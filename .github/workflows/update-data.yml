name: Update data feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      - name: Commit updated feed
        run: |
          git config user.name "cantwell-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/senate-feed.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Update data feed"
          git push
